name: Build and Release

on:
  push:
    tags:
      - "v*.*.*" # 触发条件：推送 v 开头的 tag（如 v0.5.0）

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          # - platform: "macos-latest"
          #   args: "--target universal-apple-darwin"
          # - platform: "ubuntu-22.04"
          #   args: ""

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write # 需要写入权限来创建 release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 需要额外的 target
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract release notes from CHANGELOG
        id: extract_notes
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

          # 从当前版本标题取到下一个版本标题，不包含标题行本身
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && $0 ~ "^## \\[" { exit }
            capture { print }
          ' CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            NOTES="Release $VERSION"
          fi

          REPO="${{ github.repository }}"
          {
            echo "NOTES<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo ""
            echo "---"
            echo ""
            echo "查看完整变更日志: [CHANGELOG.md](https://github.com/${REPO}/blob/main/CHANGELOG.md)"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and upload to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "v${{ steps.extract_notes.outputs.VERSION }}"
          releaseBody: ${{ steps.extract_notes.outputs.NOTES }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
